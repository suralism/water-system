<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบจำลองหน้าตัดระดับน้ำ 2D - UBONWATCH</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-inset: #f1f5f9;
      --border: #e2e8f0;
      --text-1: #0f172a;
      --text-2: #334155;
      --text-3: #64748b;
      --brand: #0284c7;
      --brand-soft: #e0f2fe;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --success: #059669;
      --success-bg: #ecfdf5;
      --font: 'Sarabun', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1120;
        --bg-card: #111a2e;
        --bg-inset: #1a2438;
        --border: #22304a;
        --text-1: #f1f5f9;
        --text-2: #cbd5e1;
        --text-3: #94a3b8;
        --brand: #38bdf8;
        --brand-soft: rgba(56, 189, 248, 0.12);
        --danger: #f87171;
        --danger-bg: rgba(239, 68, 68, 0.15);
        --warning: #fbbf24;
        --warning-bg: rgba(245, 158, 11, 0.15);
        --success: #34d399;
        --success-bg: rgba(16, 185, 129, 0.15);
      }
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --bg-card: #111a2e;
      --bg-inset: #1a2438;
      --border: #22304a;
      --text-1: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --brand: #38bdf8;
      --brand-soft: rgba(56, 189, 248, 0.12);
      --danger: #f87171;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #fbbf24;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --success: #34d399;
      --success-bg: rgba(16, 185, 129, 0.15);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-inset: #f1f5f9;
      --border: #e2e8f0;
      --text-1: #0f172a;
      --text-2: #334155;
      --text-3: #64748b;
      --brand: #0284c7;
      --brand-soft: #e0f2fe;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --success: #059669;
      --success-bg: #ecfdf5;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      line-height: 1.4;
      padding: 10px;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .widget-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-card);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    /* Header */
    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .station-badge {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .station-name {
      font-size: 0.9rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-pill.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
    .status-pill.warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
    .status-pill.safe { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }

    /* Cross-Section Subheader (เหมือนใน SIM ของเรา) */
    .cs-subheader {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 14px;
      background: var(--bg-inset);
      border-bottom: 1px solid var(--border);
    }

    .cs-header-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cs-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--brand-soft);
      color: var(--brand);
    }

    .cs-capacity-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
      background: var(--success-bg);
      color: var(--success);
      font-variant-numeric: tabular-nums;
    }
    .cs-capacity-badge.warning { background: var(--warning-bg); color: var(--warning); }
    .cs-capacity-badge.overflow { background: var(--danger-bg); color: var(--danger); }

    .cs-legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cs-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      color: var(--text-3);
      font-weight: 600;
    }

    .cs-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
    }
    .cs-dot.ground { background: #a16207; }
    .cs-dot.water { background: #0ea5e9; }
    .cs-dot.bank { background: #57534e; }

    /* Canvas Area */
    .canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 180px;
      overflow: hidden;
      background: #000;
    }

    #crossSectionCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Footer */
    .widget-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 0.68rem;
      color: var(--text-3);
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.5; }
    }

    .credit-link {
      color: var(--brand);
      text-decoration: none;
      font-weight: 700;
    }
    .credit-link:hover { text-decoration: underline; }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-3);
      z-index: 10;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="widget-wrap">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span>กำลังโหลดแบบจำลองหน้าตัดลำน้ำ 2D...</span>
    </div>

    <!-- Header -->
    <header class="widget-header">
      <div class="header-left">
        <span class="station-badge" id="badgeStationId">M.7</span>
        <h1 class="station-name" id="stationName">สะพานเสรีประชาธิปไตย</h1>
      </div>
      <span class="status-pill safe" id="statusPill">ระดับน้ำปกติ</span>
    </header>

    <!-- Subheader (เหมือนใน SIM ของเรา) -->
    <div class="cs-subheader">
      <div class="cs-header-info">
        <span class="cs-tag">🌊 แบบจำลองหน้าตัดลำน้ำ</span>
        <div class="cs-capacity-badge" id="csCapacityBadge">
          ปริมาณน้ำในลำน้ำ: <strong id="csCapacityVal">85%</strong>
        </div>
      </div>
      <div class="cs-legend-row">
        <span class="cs-legend-item"><span class="cs-dot ground"></span> ดินริมตลิ่ง</span>
        <span class="cs-legend-item"><span class="cs-dot water"></span> ผิวน้ำ</span>
        <span class="cs-legend-item"><span class="cs-dot bank"></span> ขอบตลิ่ง</span>
      </div>
    </div>

    <!-- 2D Physics Canvas -->
    <div class="canvas-container">
      <canvas id="crossSectionCanvas" width="700" height="280"></canvas>
    </div>

    <!-- Footer -->
    <footer class="widget-footer">
      <div class="live-indicator">
        <span class="pulse-dot"></span>
        <span id="obsTime">อัปเดตล่าสุด: กำลังโหลด...</span>
      </div>
      <a href="https://water.ubon.online" target="_blank" rel="noopener" class="credit-link">UBONWATCH ↗</a>
    </footer>
  </div>

  <script>
    // 1. อ่านพารามิเตอร์ URL
    const urlParams = new URLSearchParams(window.location.search);
    const targetStationId = Number(urlParams.get("station_id") || "269"); // ค่าเริ่มต้น: M.7 (ID 269)
    const customTheme = urlParams.get("theme");

    if (customTheme === "dark" || customTheme === "light") {
      document.documentElement.setAttribute("data-theme", customTheme);
    }

    let currentModalStation = null;
    let crossSectionWavePhase = 0;
    let simOffsetM = 0; // ใน embed คือระดับจริง (offset = 0)

    const canvas = document.getElementById("crossSectionCanvas");
    const ctx = canvas.getContext("2d");

    // 2. ดึงข้อมูลสดจาก API
    async function fetchStationData() {
      try {
        const res = await fetch(`/api/water-levels?search=${targetStationId}`);
        const json = await res.json();
        let item = null;
        if (json.success && json.data && json.data.length > 0) {
          item = json.data.find(s => s.station.id === targetStationId) || json.data[0];
        } else {
          const allRes = await fetch("/api/water-levels");
          const allJson = await allRes.json();
          item = allJson.data.find(s => s.station.id === targetStationId) || allJson.data[0];
        }

        if (item) {
          currentModalStation = {
            id: item.station.id,
            name: item.station.nameTh,
            waterlevelMsl: item.waterlevelMsl,
            minBankMsl: item.minBankMsl,
            freeboardM: item.freeboardM,
            situationLevel: item.situationLevel,
            observedAt: item.observedAt,
          };
          updateHeaderUI(item);
        }
        document.getElementById("loadingOverlay").style.display = "none";
      } catch (err) {
        console.error("Fetch Error:", err);
      }
    }

    function updateHeaderUI(item) {
      const st = item.station;
      document.getElementById("badgeStationId").textContent = targetStationId === 269 ? "M.7" : `ID: ${st.id}`;
      document.getElementById("stationName").textContent = st.nameTh || `สถานี ${st.id}`;

      const isOverflow = item.freeboardM !== null && item.freeboardM < 0;
      const isWarning = (item.freeboardM !== null && item.freeboardM <= 0.5) || (item.situationLevel !== null && item.situationLevel >= 4);

      const pill = document.getElementById("statusPill");
      if (isOverflow) {
        pill.textContent = `🚨 ล้นตลิ่ง ${Math.abs(item.freeboardM).toFixed(2)} ม.`;
        pill.className = "status-pill danger";
      } else if (isWarning) {
        pill.textContent = `⚠️ เฝ้าระวัง (เหลือ ${item.freeboardM.toFixed(2)} ม.)`;
        pill.className = "status-pill warning";
      } else {
        pill.textContent = `✅ ระดับน้ำปกติ`;
        pill.className = "status-pill safe";
      }

      if (item.observedAt) {
        const d = new Date(item.observedAt);
        const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        const day = d.getDate();
        const month = thaiMonths[d.getMonth()];
        const yearBE = d.getFullYear() + 543;
        const hour = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        document.getElementById("obsTime").textContent = `อัปเดต: ${day} ${month} ${yearBE} • ${hour}:${min} น.`;
      }
    }

    // 3. ฟังก์ชันวาด Canvas ตัวเดียวกับใน SIM ของเว็บเรา 100%
    function drawCrossSection() {
      if (!canvas || !currentModalStation) return;
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      const isDark = document.documentElement.getAttribute("data-theme") === "dark" || 
                     (!document.documentElement.getAttribute("data-theme") && window.matchMedia('(prefers-color-scheme: dark)').matches);

      // ค่าระดับน้ำจริง
      const actualWaterLevel = currentModalStation.waterlevelMsl ?? 100;
      const bankLevel = currentModalStation.minBankMsl ?? (actualWaterLevel + 2);
      const bedLevel = bankLevel - 7; // สมมติท้องน้ำลึก 7 เมตรจากตลิ่ง

      const simulatedWaterLevel = actualWaterLevel + simOffsetM;
      const currentFreeboard = bankLevel - simulatedWaterLevel;
      const isOverflow = currentFreeboard < 0;
      const isWarning = currentFreeboard <= 0.5 && !isOverflow;

      // อัปเดต Capacity Badge
      const capacityPct = Math.round(((simulatedWaterLevel - bedLevel) / (bankLevel - bedLevel)) * 100);
      const capValEl = document.getElementById("csCapacityVal");
      const capBadgeEl = document.getElementById("csCapacityBadge");
      if (capValEl && capBadgeEl) {
        capValEl.textContent = `${capacityPct}% (${isOverflow ? 'น้ำเอ่อล้นตลิ่ง' : isWarning ? 'ใกล้ตลิ่ง' : 'ปกติ'})`;
        capBadgeEl.className = `cs-capacity-badge ${isOverflow ? 'overflow' : isWarning ? 'warning' : ''}`;
      }

      // 1. Sky / Background Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      if (isDark) {
        skyGrad.addColorStop(0, "#0b1329");
        skyGrad.addColorStop(1, "#111c38");
      } else {
        skyGrad.addColorStop(0, "#e0f2fe");
        skyGrad.addColorStop(1, "#f8fafc");
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // คำนวณพิกัด Y
      const bankY = 70;
      const bedY = height - 40;
      const bankRange = bedY - bankY;
      
      // ระดับน้ำ Y
      const waterRatio = Math.max(0, Math.min(1.3, (simulatedWaterLevel - bedLevel) / (bankLevel - bedLevel)));
      const waterSurfaceY = bedY - (waterRatio * bankRange);

      // 2. วาดพื้นดินตลิ่งซ้ายและขวา (Embankment Ground)
      ctx.fillStyle = isDark ? "#451a03" : "#78350f";
      ctx.beginPath();
      // ตลิ่งซ้าย
      ctx.moveTo(0, bankY);
      ctx.lineTo(130, bankY);
      ctx.bezierCurveTo(170, bankY + 20, 210, bedY, 260, bedY);
      // ท้องน้ำ
      ctx.lineTo(width - 260, bedY);
      // ตลิ่งขวา
      ctx.bezierCurveTo(width - 210, bedY, width - 170, bankY + 20, width - 130, bankY);
      ctx.lineTo(width, bankY);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      // ขอบหญ้าบนตลิ่ง
      ctx.fillStyle = isDark ? "#065f46" : "#15803d";
      ctx.fillRect(0, bankY - 4, 132, 5);
      ctx.fillRect(width - 132, bankY - 4, 132, 5);

      // 3. วาดผิวน้ำพร้อมคลื่น Sine Wave Physics
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(100, height);
      ctx.lineTo(100, waterSurfaceY);

      // วาดลูกคลื่น
      for (let x = 100; x <= width - 100; x += 5) {
        const wave = Math.sin((x * 0.035) + crossSectionWavePhase) * 3 + Math.cos((x * 0.07) - crossSectionWavePhase) * 1.5;
        ctx.lineTo(x, waterSurfaceY + wave);
      }

      ctx.lineTo(width - 100, height);
      ctx.closePath();

      // Water Body Gradient
      const waterGrad = ctx.createLinearGradient(0, waterSurfaceY, 0, height);
      if (isOverflow) {
        waterGrad.addColorStop(0, "rgba(239, 68, 68, 0.85)");
        waterGrad.addColorStop(1, "rgba(185, 28, 28, 0.95)");
      } else if (isWarning) {
        waterGrad.addColorStop(0, "rgba(245, 158, 11, 0.85)");
        waterGrad.addColorStop(1, "rgba(180, 83, 9, 0.95)");
      } else {
        waterGrad.addColorStop(0, "rgba(14, 165, 233, 0.82)");
        waterGrad.addColorStop(1, "rgba(2, 132, 199, 0.95)");
      }
      ctx.fillStyle = waterGrad;
      ctx.fill();
      ctx.restore();

      // 4. วาดทุ่นลอยน้ำ / เรือจำลอง (Floating Marker)
      const boatX = width / 2;
      const boatWave = Math.sin((boatX * 0.035) + crossSectionWavePhase) * 3;
      const boatY = waterSurfaceY + boatWave;

      ctx.save();
      ctx.translate(boatX, boatY);
      ctx.rotate(Math.cos(crossSectionWavePhase) * 0.08);

      // ทุ่น/เรือ
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.arc(0, -2, 10, 0, Math.PI, false);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(-2, -14, 4, 12);
      ctx.beginPath();
      ctx.moveTo(2, -14);
      ctx.lineTo(12, -9);
      ctx.lineTo(2, -4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 5. วาดเส้นระดับตลิ่ง (Bank Level Line)
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(40, bankY);
      ctx.lineTo(width - 40, bankY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = isDark ? "#fca5a5" : "#dc2626";
      ctx.font = "bold 12px 'Sarabun', sans-serif";
      ctx.fillText(`🚨 ระดับตลิ่ง: ${bankLevel.toFixed(2)} ม.รทก.`, 45, bankY - 8);

      // 6. เสาวัดระดับน้ำ (Staff Gauge) บนตลิ่ง
      const gaugeX = 140;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(gaugeX, bankY - 30, 16, bedY - bankY + 40);
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(gaugeX, bankY - 30, 16, bedY - bankY + 40);

      // ขีดบอกระยะบนเสา
      ctx.fillStyle = "#0f172a";
      for (let gy = bankY - 20; gy < bedY + 10; gy += 12) {
        ctx.fillRect(gaugeX + 8, gy, 8, 2);
      }

      // 7. ป้ายแสดงระดับน้ำปัจจุบันลอยเหนือผิวน้ำ
      ctx.fillStyle = isOverflow ? "#dc2626" : isWarning ? "#d97706" : (isDark ? "#38bdf8" : "#0284c7");
      ctx.font = "bold 13px 'Sarabun', sans-serif";
      const waterLabel = `ระดับน้ำ: ${simulatedWaterLevel.toFixed(2)} ม.รทก. (${currentFreeboard >= 0 ? 'เหลืออีก ' + currentFreeboard.toFixed(2) + ' ม. จะถึงตลิ่ง' : 'ล้นตลิ่ง ' + Math.abs(currentFreeboard).toFixed(2) + ' ม.'})`;
      ctx.fillText(waterLabel, width / 2 - 120, waterSurfaceY - 14);
    }

    function renderLoop() {
      drawCrossSection();
      crossSectionWavePhase += 0.05;
      requestAnimationFrame(renderLoop);
    }

    // เริ่มทำงาน
    fetchStationData().then(() => {
      renderLoop();
    });

    // รีเฟรชข้อมูลทุก 3 นาที
    setInterval(fetchStationData, 3 * 60 * 1000);
  </script>
</body>
</html>
