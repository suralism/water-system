name = "ubonwatch-water"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets Configuration (Frontend Dashboard)
[assets]
directory = "./public"
binding = "ASSETS"

# Cron Trigger: ทำงานทุก 5 นาทีเพื่ออัปเดตข้อมูลระดับน้ำและปริมาณน้ำฝน
[triggers]
crons = ["*/5 * * * *"]
